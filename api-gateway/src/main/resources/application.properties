# SmartLogix API Gateway / BFF
spring.application.name=api-gateway
server.port=8080

# DevTools is kept as a dependency for development, but automatic restarts/file watching
# are disabled to avoid request hangs caused by console logging during local demos.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Spring Cloud Gateway routes.
# The frontend must call the gateway first; the gateway forwards requests to each backend service.
spring.cloud.gateway.server.webmvc.routes[0].id=identity-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=identity-users-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users,/api/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[4].id=shipping-service
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/shipping/**

smartlogix.services.identity.url=http://localhost:8084
smartlogix.services.inventory.url=http://localhost:8081
smartlogix.services.orders.url=http://localhost:8082
smartlogix.services.shipping.url=http://localhost:8083

# Actuator endpoints for local validation and academic demos.
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.gateway.enabled=true

info.app.name=api-gateway
info.app.description=SmartLogix Backend For Frontend and API Gateway

# Basic logs for gateway, web and security troubleshooting during development.
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.server.mvc=INFO
logging.level.reactor.netty.http.client=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot.devtools=OFF
# Enable this only when tracing a specific request; DEBUG per request can saturate the console.
logging.level.cl.duoc.smartlogix.gateway.filter.CorrelationIdFilter=INFO

# CORS for local development is configured in config/CorsConfig.java.
# Allowed origins: http://localhost:3000 and http://localhost:5173.

# Academic MVP JWT settings shared with identity-service. This is not a production secret.
smartlogix.jwt.secret=smartlogix-academic-mvp-secret-key-change-later-minimum-64-characters
