# SmartLogix API Gateway / BFF
spring.application.name=api-gateway
server.port=8080

# Spring Cloud Gateway routes.
# The frontend must call the gateway first; the gateway forwards requests to each backend service.
spring.cloud.gateway.mvc.routes[0].id=inventory-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.mvc.routes[1].id=order-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[2].id=shipping-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/shipping/**

# Actuator endpoints for local validation and academic demos.
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.gateway.enabled=true

info.app.name=api-gateway
info.app.description=SmartLogix Backend For Frontend and API Gateway

# Basic logs for gateway, web and security troubleshooting during development.
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.server.mvc=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# CORS for local development is configured in config/CorsConfig.java.
# Allowed origins: http://localhost:3000 and http://localhost:5173.
