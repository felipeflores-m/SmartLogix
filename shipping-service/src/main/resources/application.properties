spring.application.name=shipping-service
server.port=8083

# DevTools is available for development, but automatic restart/live reload is disabled
# to avoid request hangs caused by noisy console output during local demos.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5435/smartlogix_shipping_db
spring.datasource.username=smartlogix
spring.datasource.password=smartlogix123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
# Keep SQL console logging disabled. We already confirmed that show-sql can block
# local request threads when Postman sends repeated calls.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=smartlogix
spring.rabbitmq.password=smartlogix123
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.template.reply-timeout=5s
spring.rabbitmq.requested-heartbeat=30s

# Academic MVP JWT settings shared with identity-service. This is not a production secret.
smartlogix.jwt.secret=smartlogix-academic-mvp-secret-key-change-later-minimum-64-characters
