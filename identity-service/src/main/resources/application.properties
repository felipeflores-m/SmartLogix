spring.application.name=identity-service
server.port=8084

# DevTools is kept as a dependency for development, but automatic restarts/file watching
# are disabled to avoid request hangs caused by console logging during local demos.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5436/smartlogix_identity_db
spring.datasource.username=smartlogix
spring.datasource.password=smartlogix123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
# Avoid per-request SQL printing in the console. In local testing this can block
# request threads when many calls are sent from Postman.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.boot.devtools=OFF

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Academic MVP JWT settings. This HS256 secret is local-only and must not be used in production.
smartlogix.jwt.issuer=smartlogix-identity-service
smartlogix.jwt.expiration-seconds=3600
smartlogix.jwt.secret=smartlogix-academic-mvp-secret-key-change-later-minimum-64-characters
