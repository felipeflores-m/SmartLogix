info:
  name: "Login Operator"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
        {
          "email": "operator@smartlogix.cl",
          "password": "operator123"
        }
  auth: none
  headers:
    - name: "Content-Type"
      value: "application/json"
      disabled: false

runtime:
  scripts:
    - type: after-response
      code: |-
          const body = res.getBody();
          if (body && body.data && body.data.accessToken) {
            bru.setEnvVar("token", body.data.accessToken);
          }

settings:
  encodeUrl: true
