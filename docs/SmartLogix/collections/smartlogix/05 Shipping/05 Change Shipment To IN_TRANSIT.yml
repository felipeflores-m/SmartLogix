info:
  name: "Change Shipment To IN_TRANSIT"
  type: http
  seq: 5

http:
  method: PATCH
  url: "http://localhost:8080/api/shipping/shipments/{{shipmentId}}/status"
  body:
    type: json
    data: |-
      {
        "status": "IN_TRANSIT",
        "comment": "Envio despachado desde Bruno"
      }
  auth:
    type: bearer
    token: "{{token}}"

headers:
  - name: Content-Type
    value: application/json
    enabled: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("debe responder 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
