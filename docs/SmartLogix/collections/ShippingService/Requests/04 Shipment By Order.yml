info:
  name: Shipment By Order
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8083/api/shipping/shipments/order/{{orderId}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = typeof res.body === "string" ? JSON.parse(res.body || "{}") : (res.body || {});
        const data = body.data || body;

        const shipmentId = data.id;
        const shipmentNumber = data.shipmentNumber;

        if (shipmentId) {
          bru.setVar("shipmentId", String(shipmentId));
          try {
            bru.setEnvVar("shipmentId", String(shipmentId), { persist: true });
          } catch (error) {
            console.log("shipmentId disponible solo en variables de ejecucion");
          }

          if (shipmentNumber) {
            bru.setVar("shipmentNumber", String(shipmentNumber));
            try {
              bru.setEnvVar("shipmentNumber", String(shipmentNumber), { persist: true });
            } catch (error) {
              console.log("shipmentNumber disponible solo en variables de ejecucion");
            }
          }

          console.log("Envio guardado:", shipmentId, shipmentNumber);
        } else {
          console.log("No se encontro shipmentId en Shipment By Order. Revisa que orderId exista.");
        }
    - type: tests
      code: |-
        test("consulta de envio por pedido debe responder 200 si existe orderId", function () {
          expect([200, 404, 500]).to.include(res.status);
        });

        test("si responde 200, debe retornar id", function () {
          const body = typeof res.body === "string" ? JSON.parse(res.body || "{}") : (res.body || {});
          if (res.status === 200) {
            expect(body.data.id).to.exist;
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
